# Releases package.json's version when it isn't released yet: on each push
# to main (a merged "version X.Y.Z" pull request, see release-prepare.yml),
# or by hand on main to resume a release that failed. Built from the last
# commit of the pull request that set the version: checks, npm publish, the
# tag vX.Y.Z on that commit, and the GitHub release with the version's notes
# from CHANGELOG.md. Each step is skipped when already done, so a rerun
# finishes what's missing: once published, only the notes are checked again.
# The package is packed once: that tarball is checked, type-tested and
# published. No dependency cache in a publishing workflow (setup-node's
# advice).
#
# Publishing uses npm's trusted publishing (OIDC): no token. It's set up on
# npmjs.com, in the package's settings: GitHub Actions,
# hyperwatch/hyperwatch, workflow release.yml.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  # The pull request of the version commit (state step)
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A manual run from another branch releases nothing: only main ships
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Shallow: most runs find the version released and stop there
      - uses: actions/checkout@v4

      - name: What's left to do
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          # Each lookup tells "not there" from a failure, which stops the run:
          # an outage must not read as "not released yet"
          if published=$(npm view "$name@$version" version 2> npm-view.log); then
            :
          elif grep -q E404 npm-view.log; then
            published=
          else
            cat npm-view.log
            exit 1
          fi
          tag=$(git ls-remote --exit-code --tags origin "refs/tags/v$version" "refs/tags/v$version^{}") || {
            [ $? -eq 2 ] || exit 1
            tag=
          }
          if release=$(gh release view "v$version" --json tagName --jq .tagName 2> gh-release.log); then
            :
          elif grep -q 'release not found' gh-release.log; then
            release=
          else
            cat gh-release.log
            exit 1
          fi
          rm -f npm-view.log gh-release.log
          if [ -n "$published" ] && [ -n "$tag" ] && [ -n "$release" ]; then
            echo "$version is released"
            exit 0
          fi
          # The history, to find the commit that set the version
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --quiet --unshallow origin '+refs/heads/main:refs/remotes/origin/main'
          else
            git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main'
          fi
          bump=$(git log -1 --format=%H -G "\"version\": \"${version//./\\.}\"" -- package.json)
          if [ "$(git show "$bump:package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")" != "$version" ]; then
            echo "No commit sets the version to $version"
            exit 1
          fi
          # The release is the last commit its pull request put on main, the
          # notes rewritten after the bump included, whatever the merge
          # method (squash, rebase or merge commit); the bump itself when it
          # was pushed without a pull request
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$bump/pulls" \
            --jq '[.[] | select(.merged_at and .base.ref == "main")][0].merge_commit_sha // empty')
          commit=${commit:-$bump}
          # Only what is on main ships
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "$commit isn't on main"
            exit 1
          fi
          # An existing tag must be on that commit (peeled: an annotated
          # tag's commit is the ^{} line)
          if [ -n "$tag" ]; then
            tagged=$(echo "$tag" | awk '/\^\{\}$/ { print $1 }')
            tagged=${tagged:-$(echo "$tag" | awk '{ print $1 }')}
            if [ "$tagged" != "$commit" ]; then
              echo "v$version is on $tagged, not on $commit"
              exit 1
            fi
          fi
          echo "Releasing $version from $commit"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "publish=$([ -z "$published" ] && echo true)"
            echo "tag=$([ -z "$tag" ] && echo true)"
            echo "release=$([ -z "$release" ] && echo true)"
          } >> "$GITHUB_OUTPUT"

      - if: steps.state.outputs.version
        run: git checkout --detach "${{ steps.state.outputs.commit }}"
      # Without dependencies: checked on every run, as the GitHub release
      # takes its notes from there
      - name: Notes
        if: steps.state.outputs.version
        run: node scripts/release.js verify

      # Publishing only: a rerun that only tags or creates the GitHub release
      # skips the install and the checks
      - if: steps.state.outputs.publish
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later
      - if: steps.state.outputs.publish
        run: |
          if ! node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
      - if: steps.state.outputs.publish
        run: npm ci

      - name: Checks
        if: steps.state.outputs.publish
        run: |
          npm test
          npm run lint
          npm run prettier:check
          npm run type:check
          npm run depcheck

      # One tarball (prepack builds the declarations once): its contents
      # checked, its declarations type-tested, and published as is
      - name: Pack
        id: pack
        if: steps.state.outputs.publish
        run: |
          tarball="$RUNNER_TEMP/$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -1)"
          node scripts/release.js pack "$tarball"
          npm run types:test -- "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.state.outputs.publish
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public

      - name: Tag
        if: steps.state.outputs.tag
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "version $VERSION"
          git push origin "v$VERSION"

      - name: GitHub release
        if: steps.state.outputs.release
        env:
          VERSION: ${{ steps.state.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.js notes "$VERSION" "$RUNNER_TEMP/notes.md"
          echo "- **npm:** https://www.npmjs.com/package/@hyperwatch/hyperwatch/v/$VERSION" >> "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest
